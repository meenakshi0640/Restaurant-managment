<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Juice</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #effaf3;
        }

        .form-card {
            max-width: 650px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            color: #198754;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="form-card">

        <h1 class="page-title text-center">
            🥤 Add New Juice
        </h1>

        <p class="text-center">
            Enter the new juice details.
        </p>

        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Juice Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter juice name"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Enter description"></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Price
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="price"
                    class="form-control"
                    placeholder="Enter price"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success w-100">

                Save Juice

            </button>

        </form>

        <a
            href="/admin/juices"
            class="btn btn-outline-dark w-100 mt-3">

            ← Back to Manage Juices

        </a>

    </div>

</div>

</body>
</html>
