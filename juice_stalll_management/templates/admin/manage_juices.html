<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Juices</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7f5;
        }

        .top-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            color: #198754;
            font-weight: bold;
        }

        .description-column {
            max-width: 320px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="top-section mb-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>

                <h1 class="page-title">
                    🥤 Manage Juices
                </h1>

                <p class="mb-0">
                    Add, edit, delete, search and filter juices.
                </p>

            </div>

            <div>

                <a
                    href="/admin/dashboard"
                    class="btn btn-outline-dark">

                    ← Dashboard

                </a>

                <a
                    href="/admin/juices/add"
                    class="btn btn-success">

                    + Add New Juice

                </a>

            </div>

        </div>

    </div>

    <div class="top-section mb-4">

        <form method="GET">

            <div class="row g-3">

                <div class="col-md-4">

                    <label class="form-label">
                        Search by Juice Name
                    </label>

                    <input
                        type="text"
                        name="search"
                        class="form-control"
                        value="{{ search_text }}"
                        placeholder="Example: Mango">

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Minimum Price
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="min_price"
                        class="form-control"
                        value="{{ min_price }}"
                        placeholder="Minimum">

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Maximum Price
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="max_price"
                        class="form-control"
                        value="{{ max_price }}"
                        placeholder="Maximum">

                </div>

                <div class="col-md-2 d-flex align-items-end">

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        Search

                    </button>

                </div>

            </div>

        </form>

        <div class="mt-3">

            <a
                href="/admin/juices"
                class="btn btn-outline-secondary">

                Clear Filters

            </a>

        </div>

    </div>

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-success">

                <tr>

                    <th>ID</th>

                    <th>Juice Name</th>

                    <th>Description</th>

                    <th>Price</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                {% for juice in juices %}

                <tr>

                    <td>
                        {{ juice.id }}
                    </td>

                    <td>
                        <strong>
                            {{ juice.name }}
                        </strong>
                    </td>

                    <td class="description-column">
                        {{ juice.description }}
                    </td>

                    <td>
                        ₹{{ juice.price }}
                    </td>

                    <td>

                        <a
                            href="/admin/juices/edit/{{ juice._id }}"
                            class="btn btn-warning btn-sm">

                            Edit

                        </a>

                        <form
                            action="/admin/juices/delete/{{ juice._id }}"
                            method="POST"
                            class="d-inline"
                            onsubmit="return confirm('Are you sure you want to delete this juice?');">

                            <button
                                type="submit"
                                class="btn btn-danger btn-sm">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                {% else %}

                <tr>

                    <td
                        colspan="5"
                        class="text-center py-4">

                        No juices found.

                    </td>

                </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
