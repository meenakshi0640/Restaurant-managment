<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Ingredient</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #effaf3;
        }

        .form-card {
            max-width: 700px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1 class="page-title text-center">
            📦 Add Ingredient
        </h1>

        <p class="text-center text-muted">
            Enter the ingredient and stock details.
        </p>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Ingredient Name
                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Example: Mango"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Unit
                </label>

                <select name="unit"
                        class="form-select"
                        required>

                    <option value="">
                        Select unit
                    </option>

                    <option value="kg">kg</option>
                    <option value="litre">litre</option>
                    <option value="ml">ml</option>
                    <option value="piece">piece</option>
                    <option value="packet">packet</option>
                    <option value="gram">gram</option>

                </select>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Current Stock
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="current_stock"
                           class="form-control"
                           placeholder="Enter current stock"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Reorder Level
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="reorder_level"
                           class="form-control"
                           placeholder="Enter reorder level"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Cost Per Unit
                </label>

                <input type="number"
                       step="0.01"
                       min="0"
                       name="cost_per_unit"
                       class="form-control"
                       placeholder="Enter cost per unit"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-success w-100">

                Save Ingredient
            </button>

        </form>

        <a href="{{ url_for('inventory') }}"
           class="btn btn-outline-dark w-100 mt-3">

            ← Back to Inventory
        </a>

    </div>

</div>

</body>
</html>
