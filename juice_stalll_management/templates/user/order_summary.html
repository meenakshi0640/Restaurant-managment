<!DOCTYPE html>

<html>

<head>

    <title>Order Summary</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-5">

<h2 class="text-center mb-4">

🧾 Order Summary

</h2>

<h4>

Branch :
<span class="text-primary">

{{ branch }}

</span>

</h4>

<br>

<table class="table table-bordered">

<thead>

<tr>

<th>Product</th>

<th>Quantity</th>

<th>Unit Price</th>

<th>Total</th>

</tr>

</thead>

<tbody>

{% for item in cart %}

<tr>

<td>

{{ item.product.name }}

</td>

<td>

{{ item.quantity }}

</td>

<td>

₹ {{ item.product.price }}

</td>

<td>

₹ {{ item.total }}

</td>

</tr>

{% endfor %}

</tbody>

</table>

<h3 class="text-end">

Grand Total :
₹ {{ grand_total }}

</h3>

<br>

<div class="d-flex justify-content-between">

<a
href="{{ url_for('view_cart') }}"
class="btn btn-secondary btn-lg">

← Back to Cart

</a>

<a
href="{{ url_for('order_type') }}"
class="btn btn-success btn-lg">

Continue →

</a>

</div>

</div>

</div>

</body>

</html>
