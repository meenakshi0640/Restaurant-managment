<!DOCTYPE html>

<html>

<head>

<title>Choose Order Type</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-5">

<h2 class="text-center">

Choose Order Type

</h2>

<br>

<form action="{{ url_for('select_order_type') }}" method="POST">

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="order_type"
value="Dine In"
required>

<label class="form-check-label">

🍽 Dine In

</label>

</div>

<br>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="order_type"
value="Home Delivery">

<label class="form-check-label">

🏠 Home Delivery

</label>

</div>

<br>

<button
class="btn btn-success btn-lg w-100">

Continue

</button>

</form>

</div>

</div>

</body>

</html>
