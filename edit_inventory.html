<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Ingredient</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #fff8e8;
        }

        .form-card {
            max-width: 700px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            color: #d88700;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1 class="page-title text-center">
            ✏️ Edit Ingredient
        </h1>

        <p class="text-center text-muted">
            Update the ingredient and stock details.
        </p>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Ingredient ID
                </label>

                <input type="text"
                       class="form-control"
                       value="{{ ingredient.id }}"
                       disabled>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Ingredient Name
                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ ingredient.name }}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Unit
                </label>

                <select name="unit"
                        class="form-select"
                        required>

                    <option value="kg"
                        {% if ingredient.unit == 'kg' %}selected{% endif %}>
                        kg
                    </option>

                    <option value="litre"
                        {% if ingredient.unit == 'litre' %}selected{% endif %}>
                        litre
                    </option>

                    <option value="ml"
                        {% if ingredient.unit == 'ml' %}selected{% endif %}>
                        ml
                    </option>

                    <option value="piece"
                        {% if ingredient.unit == 'piece' %}selected{% endif %}>
                        piece
                    </option>

                    <option value="packet"
                        {% if ingredient.unit == 'packet' %}selected{% endif %}>
                        packet
                    </option>

                    <option value="gram"
                        {% if ingredient.unit == 'gram' %}selected{% endif %}>
                        gram
                    </option>

                </select>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Current Stock
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="current_stock"
                           class="form-control"
                           value="{{ ingredient.current_stock }}"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Reorder Level
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="reorder_level"
                           class="form-control"
                           value="{{ ingredient.reorder_level }}"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Cost Per Unit
                </label>

                <input type="number"
                       step="0.01"
                       min="0"
                       name="cost_per_unit"
                       class="form-control"
                       value="{{ ingredient.cost_per_unit }}"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-warning w-100">

                Update Ingredient
            </button>

        </form>

        <a href="{{ url_for('inventory') }}"
           class="btn btn-outline-dark w-100 mt-3">

            ← Back to Inventory
        </a>

    </div>

</div>

</body>
</html>
